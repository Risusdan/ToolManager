[project]
name = "toolmanager"
version = "0.1.0"
description = "Internal tool marketplace: browse, install, update, run and publish team tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nicegui>=2.0",
    "pywebview>=5.0; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10.0; sys_platform == 'win32'",
    "httpx>=0.27",
    "keyring>=25.0",
    "tomli-w>=1.0",
    "packaging>=24.0",
]

[project.scripts]
toolmanager = "toolmanager.main:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolmanager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
