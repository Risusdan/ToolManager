# defaults.toml for the customer edition installer (ToolManagerSetup-<version>-customer.exe).
# Copy this file, fill in the customer catalog repo, and pass it to
#   scripts\build_windows.ps1 -CustomerDefaultsFile <your copy>
# Keep the filled-in copy out of git: it names company servers.

# Data (installed tools, settings, logs) stays in a "data" folder inside the install folder
# (%LOCALAPPDATA%\ToolManager-Customer), so it never mixes with the internal edition.
portable = true

# Main colour (#rrggbb), shown in the top strip, logo, buttons and selections, so the customer
# edition is easy to tell apart from the internal (blue) one. Leave it out for the standard blue.
accent = "#0d9488"

[bitbucket]
base_url = "https://bitbucket.example.com"   # the externally reachable co-git address
project = "CUST"                             # project holding the customer catalog
repo = "customer-catalog"                    # the customer catalog repo (not the internal one)
branch = "main"
